name: release
# 릴리스할 때(v* 태그 push)와 수동 실행 때만 빌드. 풀 리퀘스트로는 실행되지 않음.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: mingw-apt-ubuntu2404-v1
      - name: Install MinGW
        run: |
          mkdir -p ~/apt-cache
          sudo apt-get update -q
          sudo apt-get install -y -q -o Dir::Cache::Archives="$HOME/apt-cache" mingw-w64
          sudo chown -R "$USER" ~/apt-cache
      - name: Build
        run: ./build.sh
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" out/PopupDesktop.exe --title "팝업 바탕화면 ${GITHUB_REF_NAME}" --generate-notes
