name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PopupDesktop
          path: out/PopupDesktop.exe
